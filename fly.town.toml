# The town server on Fly.io: one always-on Machine with a volume (SQLite is a single writer, so never more than one Machine).
# Build and deploy the image with deploy/fly/build.sh (a plain `fly deploy` fails: the build context needs .git shipped as `gitdir`).
# deploy/README.md has the whole procedure. Live code and state are on the volume; the image is the runtime plus a first-boot seed.
app = "muster-town"
primary_region = "iad"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  MUSTER_TOWN_COLLECTIVE = "collectives/workshop"
  HOST = "0.0.0.0"
  PORT = "4322"
  # redeploy pulls `prod`, which CI (.github/workflows/ci.yml) fast-forwards to each green commit of main: red main never goes live
  MUSTER_TOWN_DEPLOY_BRANCH = "prod"
  MUSTER_TOWN_PUBLIC_URL = "https://muster.town"
  # the town's state lives beside the checkout (/data/repo), never inside it: replacing the checkout can't touch the database
  MUSTER_TOWN_DATA = "/data/workshop/data"
  MUSTER_TOWN_EXPORT = "/data/workshop/export"
  # desks are Fly Machines in the muster-desks app. The repo token is the collective's GH_TOKEN secret at the Town Hall; a host
  # GH_TOKEN Fly secret is the fallback (ghToken "env"). No maxRunning here: it is a live setting (PUT /api/town/desks) kept in the database.
  MUSTER_TOWN_DESKS = '{"backend":"fly","townUrl":"https://muster.town","ghToken":"env"}'
  FLY_APP = "muster-desks"

[mounts]
  source = "town_data"
  destination = "/data"

[http_service]
  internal_port = 4322
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "240s" # the first boot copies the checkout onto the volume (about a minute)

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
