# CI for Muster Town, and the gate in front of the live town (deploy/README.md, "CI and redeploy").
# Every push to main and every PR: typecheck, tests, web build. A green main commit is promoted to the `prod` branch
# (fast-forward only) and the live town is asked to redeploy; prod pulls only `prod` (MUSTER_TOWN_DEPLOY_BRANCH), so a
# red commit on main never goes live, and the Workshop's residents, who work on this repo from inside the town they
# would break, can keep pushing to main without review.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# PRs: a new push cancels the running check. main: pushes queue instead (GitHub keeps one running + the newest pending run
# per group, so a burst still costs at most two full runs). With cancel-in-progress on main, a merge every 1-2 min cancelled
# every run before promote could move `prod` (11-04: 12 merges in 17 min, 20 commits never deployed, 8 no-op redeploys).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # scripts/check.ts, the same full check a desk runs: check:docs (README/CLAUDE.md/AGENTS.md/SKILL.md/manual.md name
      # only paths, npm scripts and verbs that exist; docs/invariants/*.md cite only tests that exist), check:deadcode
      # (knip.json), typecheck, tests; stops at the first failure and ends with one per-step timing line, which the next
      # step copies to the job summary (shown on the run page without opening the log), red runs included
      - run: npm run check 2>&1 | tee check.log
        shell: bash # -o pipefail: the step fails when the check does, not when tee succeeds
      - if: ${{ !cancelled() }}
        run: |
          line=$(grep -E '^check( --fast)?: .*total ' check.log | tail -1 || true)
          echo "\`${line:-check: no timing line (stopped before the first step finished)}\`" >> "$GITHUB_STEP_SUMMARY"
      # web CSS stays on one type scale and one palette (packages/web/src/type.css): no font size off var(--fs-*), no colour
      # literal outside the palette's :root block (grant gr_kvmwutmybu); prints file:line for each stray
      - run: npm run check:css
      - run: npm run build --workspace packages/web

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    # up to 15 min of debounce below; the workflow's concurrency group cancels a waiting run when a newer push comes in
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # fast-forward only: never force. If prod was reset by hand to an older green sha, this still fast-forwards.
      - run: git push origin "${GITHUB_SHA}:refs/heads/prod"
      # MUSTER_TOWN_DEPLOY_TOKEN: a town token holding `town.redeploy` (the "CI" visitor with the deployer role). Skipped
      # until it is set. Doesn't wait for the restart: the drain can take 30 min. /api/health's `commit` shows when it is live.
      # Fewer restarts (docs/postmortem-2026-10-31-cpu-throttle-503.md suggestion 6), CI's requests only (the town's own
      # `redeploy` tool is unchanged):
      #  - no redeploy when nothing since the live commit can change the running town: only docs/ (but docs/manual.md, which
      #    the server serves), .github/ or top-level *.md files. prod still moves; the next redeploy takes those commits along.
      #  - at most one CI restart per 15 min: when the server started less than 15 min ago, wait out the rest. A push meanwhile
      #    cancels this run (concurrency above) and its own run redeploys the newer commit, so a burst ends in one restart.
      - name: redeploy muster.town
        env:
          TOKEN: ${{ secrets.MUSTER_TOWN_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "MUSTER_TOWN_DEPLOY_TOKEN not set; skipping redeploy"; exit 0; fi
          health=$(curl -fsS -m 20 https://muster.town/api/health || true)
          live=$(printf '%s' "$health" | jq -r '.commit // empty' 2>/dev/null || true)
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$live" "$GITHUB_SHA")
            runtime=$(printf '%s\n' "$changed" | grep -vE '^(docs/|\.github/|[^/]+\.md$)' | grep -v '^$' || true)
            runtime="$runtime$(printf '%s\n' "$changed" | grep -x 'docs/manual.md' || true)"
            if [ -z "$runtime" ]; then
              echo "only docs/CI files changed since the live ${live:0:7}; no redeploy (prod is at ${GITHUB_SHA:0:7})"
              exit 0
            fi
          fi
          started=$(printf '%s' "$health" | jq -r '.startedAt // empty' 2>/dev/null || true)
          if [ -n "$started" ]; then
            wait=$(( $(date -d "$started" +%s) + 900 - $(date +%s) ))
            if [ "$wait" -gt 0 ]; then
              echo "the server started at $started: waiting ${wait}s so CI restarts it at most once per 15 min"
              sleep "$wait"
            fi
          fi
          curl -fsS -X POST https://muster.town/api/admin/redeploy \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"image":false}'

  # The published self-host image (docs/self-host.md path B, gr_q1jrelx2ty): every green main is built from
  # deploy/fly/Dockerfile with plain docker and pushed as ghcr.io/mitchellgordon95/muster-town:<sha> and :prod.
  # Runs beside promote (not after it); a .github/-only change doesn't redeploy the town (promote's docs/CI filter).
  # On a PR it builds and smoke-tests the PR's merge commit but pushes nothing, so a change that breaks the image or
  # path B shows red before it is merged (public repo: Actions minutes are free).
  image:
    needs: check
    runs-on: ubuntu-latest # amd64 only
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mitchellgordon95/muster-town
    steps:
      # the context is prepared like deploy/fly/build.sh: a fresh public clone (not actions/checkout, whose token in
      # .git/config would be baked into the image), on branch main at this commit so the seed's /data/repo can `git pull`,
      # the git directory as `gitdir`, deploy/fly/dockerignore as the context's .dockerignore. The Dockerfile insists the
      # seed checkout is clean.
      - name: build context
        run: |
          git clone -q --branch main https://github.com/mitchellgordon95/muster-town.git ctx
          cd ctx
          git fetch -q origin "$GITHUB_REF" # a PR's merge commit (refs/pull/N/merge) is not on main
          git reset -q --hard "$GITHUB_SHA"
          git remote set-url origin https://github.com/mitchellgordon95/muster-town.git
          mv .git gitdir
          cp deploy/fly/dockerignore .dockerignore
      - name: docker build
        working-directory: ctx
        run: |
          start=$(date +%s)
          docker build -f deploy/fly/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          echo "docker build took $(( $(date +%s) - start ))s"
      # docs/self-host.md path B as a stranger runs it (kr_emrv9hzs47): the page's compose against the image just built, a
      # fresh collective.json and an empty .env. Before the push, so an image that can't boot or keep its state is never
      # published. Checks: health ok, the seeded admin token (inside the volume) is an admin on /api/me, /api/town carries
      # the collective's name; then `docker compose restart` and the same checks with the same token (state survived).
      - name: image smoke (self-host path B)
        run: |
          mkdir -p smoke/mytown && cd smoke
          printf '{"name":"Smoke Town","goal":"Boot from the published image","port":4322,"buildings":[]}\n' > mytown/collective.json
          : > mytown/.env
          cat > docker-compose.yml <<YAML
          services:
            town:
              image: $IMAGE:$GITHUB_SHA
              pull_policy: never
              restart: unless-stopped
              ports: ["127.0.0.1:4322:4322"]
              volumes: ["town_data:/data", "./mytown/collective.json:/data/mytown/collective.json:ro"]
              env_file: ./mytown/.env
              environment:
                MUSTER_TOWN_COLLECTIVE: /data/mytown
                PORT: "4322"
                HOST: 0.0.0.0
                MUSTER_TOWN_DESKS: '{"backend":"host"}'
          volumes:
            town_data:
          YAML
          up() {
            for i in $(seq 1 90); do
              if curl -fsS -m 5 http://127.0.0.1:4322/api/health > health.json 2>/dev/null && [ "$(jq -r .ok health.json)" = true ]; then
                echo "$1: health ok after ${i}x2s, commit $(jq -r .commit health.json)"; return 0
              fi
              sleep 2
            done
            echo "$1: no healthy /api/health in 180s"; docker compose logs --tail 200 town; return 1
          }
          check() {
            [ "$(jq -r .commit health.json)" = "$GITHUB_SHA" ] || { echo "$1: health commit is not $GITHUB_SHA"; return 1; }
            token=$(docker compose exec -T town cat /data/mytown/data/admin-token)
            [ -n "$token" ] || { echo "$1: no admin token in /data/mytown/data"; return 1; }
            [ "$(curl -fsS -H "authorization: Bearer $token" http://127.0.0.1:4322/api/me | jq -r .isAdmin)" = true ] || { echo "$1: admin token is not an admin on /api/me"; return 1; }
            name=$(curl -fsS http://127.0.0.1:4322/api/town | jq -r .town.name)
            [ "$name" = "Smoke Town" ] || { echo "$1: /api/town names '$name', not the collective's 'Smoke Town'"; return 1; }
            echo "$1: admin token ok, /api/town names $name"
            echo "$token" | sha256sum | cut -c1-16 > "token.$1"
          }
          docker compose up -d
          up first-boot
          check first-boot
          docker compose restart
          up after-restart
          check after-restart
          cmp token.first-boot token.after-restart || { echo "the admin token changed across the restart: state did not survive"; exit 1; }
          echo "\`image smoke: path B compose boots $GITHUB_SHA, admin token works, survives docker compose restart\`" >> "$GITHUB_STEP_SUMMARY"
          docker compose down -v
      - name: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:prod"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:prod"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:prod")
          echo "pushed $IMAGE:$GITHUB_SHA and :prod ($digest)"
          echo "\`pushed $IMAGE:${GITHUB_SHA:0:7} and :prod ($digest)\`" >> "$GITHUB_STEP_SUMMARY"
