# Build-only config for the Fly desk image (nothing is deployed from it: desks are Machines the runtime creates).
# Build and push:  fly deploy --build-only --push --image-label desk -c fly.desk.toml --access-token "$FLY_API_TOKEN"
# (or `npm run desk:fly-image`). The image lands at registry.fly.io/<app>:desk.
app = "muster-desks"

[build]
  dockerfile = "packages/desk/Dockerfile"
